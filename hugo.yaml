# Docsy config
#
# cSpell:ignore docsy fortawesome fontawesome webfonts

params:
  time_format_blog: Monday, January 02, 2006
  time_format_default: January 2, 2006
  rss_sections: [blog]

outputFormats:
  PRINT:
    baseName: index
    isHTML: true
    mediaType: text/html
    path: _print
    permalinkable: false

module:
  hugoVersion:
    extended: true
    min: 0.110.0
  mounts:
    - source: assets
      target: assets
    - source: assets/vendor/bootstrap
      target: assets/vendor/bootstrap
    - source: assets/vendor/Font-Awesome
      target: assets/vendor/Font-Awesome
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts
    - source: static
      target: static
    - source: assets/vendor/Font-Awesome/webfonts
      target: static/webfonts
